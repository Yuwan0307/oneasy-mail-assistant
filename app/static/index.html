<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>Oneasy 邮件助手</title>
  <link rel="icon" href="/static/oneasy.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=desktop-1.5">
</head>
<body>
  <div id="app">
    <aside>
      <div class="brand"><img src="/static/oneasy.svg" alt="" width="34" height="34"><div><h1>Oneasy</h1><p>邮件工作台</p></div></div>
      <div class="nav-label">工作空间</div>
      <nav id="nav" aria-label="主导航"><button data-tab="overview" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>运行概览</span></button>
<button data-tab="business"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><span>业务来信</span></button>
<button data-tab="review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4M15 3h6v6M10 14 21 3"/></svg><span>邮件人工复核</span></button>
<button data-tab="reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/></svg><span>每日汇总</span></button>
<button data-tab="audit"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>操作记录</span></button>
<button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M8 4v16"/></svg><span>邮箱与负责人</span></button></nav>
      <div class="sidebar-bottom"><div class="status-line"><span class="status-dot"></span><span id="service-state">正在连接后台</span></div><p>智能辅助 · 人工决策</p><span class="version">Oneasy / 1.6.6</span></div>
    </aside>
    <main>
      <header>
        <div><div class="eyebrow">ONEASY / MAIL ASSISTANT</div><h2 id="title">运行概览</h2><div class="muted" id="reminder-channel">六个邮箱统一监管 · 正在读取提醒设置</div></div>
        <div class="header-actions">
          <button class="secondary" id="refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg>刷新数据</button>
          <button class="secondary" id="open-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>设置</button>
          <div class="runtime-controls" role="group" aria-label="运行与窗口控制">
            <button class="secondary runtime-control" id="toggle-monitoring" type="button" title="暂停监控" aria-label="暂停监控" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect id="monitoring-square" x="6" y="6" width="12" height="12" rx="1"/><circle id="monitoring-circle" cx="12" cy="12" r="6" hidden/></svg></button>
            <button class="secondary runtime-control" id="hide-window" type="button" title="隐藏到后台" aria-label="隐藏到后台" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v13m-5-5 5 5 5-5M5 21h14"/></svg></button>
            <button class="secondary runtime-control" id="exit-app" type="button" title="完全退出" aria-label="完全退出" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
          </div>
        </div>
      </header>
      <div id="banner" aria-live="polite"></div>
      <div id="content"></div>
      <footer><span>北京时间 · 不自动回复邮件 · 所有操作记录可追溯</span><span>ONEASY MAIL ASSISTANT</span></footer>
    </main>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/static/settings.js?v=wecom-report-1.6.1" defer></script>
  <script src="/static/admin.js?v=wecom-report-1.6.1" defer></script>
</body>
</html>
